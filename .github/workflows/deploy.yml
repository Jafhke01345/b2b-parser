name: CI/CD Production Build

on:
  push:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi uvicorn

      - name: Run Backend Tests
        run: |
          cd backend
          pytest test_compliance_engine.py

  build-and-publish:
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: xcsoftware
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            xcsoftware/b2b-parser-backend:latest
            xcsoftware/b2b-parser-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            xcsoftware/b2b-parser-frontend:latest
            xcsoftware/b2b-parser-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
